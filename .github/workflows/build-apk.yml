name: Build DieggaFlix Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Project Dependencies
        run: npm install

      - name: Compile Web Production Build
        run: npm run build

      - name: Build Android APK with Bubblewrap CLI
        run: |
          npm install -g @bubblewrap/cli
          bubblewrap init --manifest="https://ais-pre-qbsrpwr4hxyuloyw3vphig-702705267157.europe-west2.run.app/manifest.webmanifest" --directory=android-twa
          cd android-twa
          bubblewrap build

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DieggaFlix-Release-APK
          path: android-twa/*.apk
          retention-days: 30
