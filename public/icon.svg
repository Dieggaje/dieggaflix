<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#4c1d95" />
    </linearGradient>
    <linearGradient id="playGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Squircle -->
  <rect width="512" height="512" rx="128" fill="#0c0d14"/>
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#grad)" stroke="#a78bfa" stroke-width="6" stroke-opacity="0.3"/>
  
  <!-- Inner Ambient Circle -->
  <circle cx="256" cy="256" r="160" fill="#2e1065" opacity="0.4" filter="url(#glow)"/>
  
  <!-- Play Symbol / Film Badge -->
  <polygon points="216,160 356,256 216,352" fill="url(#playGrad)" filter="url(#glow)"/>
  
  <!-- Small Star Sparkle Accent -->
  <path d="M 360 140 Q 370 155 385 160 Q 370 165 360 180 Q 350 165 335 160 Q 350 155 360 140 Z" fill="#fde047"/>
</svg>
